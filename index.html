<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사랑스러운 쿠샤에게</title>
    <style>
        /* 기본 리셋 및 반응형 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; /* 모바일 터치 하이라이트 제거 */
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace; /* 디지털 폰트 대체용 */
            overflow: hidden; /* 스크롤 방지 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 캔버스 (폭죽) */
        #fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* 클릭 방해 방지 */
        }

        /* 메인 컨테이너 */
        #main-container {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
            padding: 0 20px;
        }

        /* 카운트다운 타이머 (디지털 시계 스타일링) */
        #countdown {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: bold;
            letter-spacing: 2px;
            color: #0ff; /* 네온 시안색 */
            text-shadow: 
                0 0 5px #0ff, 
                0 0 10px #0ff, 
                0 0 20px #0ff, 
                0 0 40px #00aaff;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .time-label {
            font-size: clamp(1rem, 4vw, 2rem);
            color: #fff;
            text-shadow: none;
            margin-bottom: 5px;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        }

/* 선물 상자 */
        #gift-box {
            display: none; /* 초기에는 숨김 */
            font-size: clamp(5rem, 20vw, 8rem);
            cursor: pointer;
            transition: transform 0.2s;
            position: fixed; /* 화면 기준 절대 위치 설정 */
            bottom: 15%; /* 화면 맨 아래에서 15% 띄움 (원하시면 수치를 조절하세요) */
            left: 50%; /* 가로 중앙에 배치 */
            transform: translateX(-50%); /* 정확한 가로 중앙 정렬을 위한 조정 */
        }
        
        #gift-box:active {
            /* 클릭 시 위치를 유지하면서 살짝 작아지도록 수정 */
            transform: translateX(-50%) scale(0.9); 
        }

        /* 편지지 모달 (팝업) */
        #letter-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* 모달이 활성화되었을 때 */
        #letter-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 편지지 디자인 (줌인 애니메이션 포함) */
        .letter-content {
            background-color: #fcf8e3; /* 따뜻한 편지지 색상 */
            color: #333333;
            width: 85%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            text-align: center;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            
            /* 줌인 애니메이션 초기 상태 */
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 모달 활성화 시 편지지 줌인 */
        #letter-modal.show .letter-content {
            transform: scale(1);
        }

        .letter-text {
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            font-weight: 600;
            line-height: 1.6;
            margin-top: 10px;
            word-break: keep-all;
        }

        /* 닫기 (X) 버튼 */
        #close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #888;
            cursor: pointer;
            padding: 5px;
            line-height: 1;
            transition: color 0.2s;
        }

        #close-btn:active {
            color: #333;
        }
    </style>
</head>
<body>

    <!-- 폭죽을 그릴 캔버스 -->
    <canvas id="fireworks"></canvas>

    <!-- 중앙 콘텐츠 영역 -->
    <div id="main-container">
        <!-- 카운트다운 타이머 -->
        <div id="countdown">
            <div id="timer-text">00일 00:00:00</div>
        </div>

        <!-- 선물 상자 -->
        <div id="gift-box" onclick="openLetter()">🎁</div>
    </div>

    <!-- 편지지 모달 -->
    <div id="letter-modal" onclick="closeLetterOnBg(event)">
        <div class="letter-content" onclick="event.stopPropagation()">
            <button id="close-btn" onclick="closeLetter()">✖</button>
            <div class="letter-text">https://bit.ly/https://bit.ly/ToMyLoveable<br>너가 이 세상에 존재해줘서 고마워</div>
        </div>
    </div>

<script>
        // === 1. 목표 시간 설정 ===
        const targetDate = new Date("2026-09-11T00:00:00").getTime();
        const stopDate = new Date("2026-09-12T00:00:00").getTime();

        // === 2. DOM 요소 가져오기 ===
        const countdownEl = document.getElementById('countdown');
        const timerTextEl = document.getElementById('timer-text');
        const giftBoxEl = document.getElementById('gift-box');
        const letterModal = document.getElementById('letter-modal');

        let timerInterval;
        let isFireworksActive = false;

        // === 3. 초기 상태 분기 처리 (웹페이지를 켰을 때 즉시 실행) ===
        function checkInitialState() {
            const now = new Date().getTime();

            if (now < targetDate) {
                // [상태 1] 이벤트 시작 전: 카운트다운 진행
                countdownEl.style.display = 'flex';
                giftBoxEl.style.display = 'none';
                timerInterval = setInterval(updateTimer, 1000);
                updateTimer(); // 즉시 1회 계산
            } else if (now >= targetDate && now < stopDate) {
                // [상태 2] 24시간 이벤트 기간 내: 타이머 숨김 + 선물상자 + 폭죽 무한재생
                countdownEl.style.display = 'none';
                giftBoxEl.style.display = 'inline-block';
                startFireworks();
            } else {
                // [상태 3] 24시간 종료 후: 폭죽 멈춤 + 선물상자만 남음
                countdownEl.style.display = 'none';
                giftBoxEl.style.display = 'inline-block';
            }
        }

        // === 4. 카운트다운 로직 ===
        function updateTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            // 웹페이지를 켜놓고 기다리다가 0시 0분이 되는 순간의 전환
            if (diff <= 0) {
                clearInterval(timerInterval);
                countdownEl.style.display = 'none';
                giftBoxEl.style.display = 'inline-block';
                startFireworks();
                return;
            }

            // 남은 시간 계산
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const d = String(days).padStart(2, '0');
            const h = String(hours).padStart(2, '0');
            const m = String(minutes).padStart(2, '0');
            const s = String(seconds).padStart(2, '0');

            timerTextEl.innerText = `${d}일 ${h}시 ${m}분 ${s}초`;
        }

        // === 5. 모달 (편지지) 제어 로직 ===
        function openLetter() {
            letterModal.classList.add('show');
        }

        function closeLetter() {
            letterModal.classList.remove('show');
        }

        // === 6. HTML5 Canvas 폭죽 애니메이션 ===
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let cw, ch;

        function resizeCanvas() {
            cw = canvas.width = window.innerWidth;
            ch = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        const rockets = [];
        const colors = ['#ff00ff', '#00ffff', '#00ff00', '#ffff00', '#ff0055', '#5500ff'];

        class Rocket {
            constructor() {
                this.x = Math.random() * cw;
                this.y = ch;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = -(Math.random() * 4 + 8 + (ch / 200));
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.targetY = Math.random() * (ch * 0.6) + (ch * 0.1);
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.08;
                if (this.vy >= 0 || this.y <= this.targetY) {
                    this.explode();
                    return false;
                }
                return true;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            explode() {
                const particleCount = Math.floor(Math.random() * 30) + 50;
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(this.x, this.y, this.color));
                }
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.color = color;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }
            update() {
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.vy += 0.15;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                return this.alpha > 0;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function startFireworks() {
            if (isFireworksActive) return;
            isFireworksActive = true;
            
            function animate() {
                requestAnimationFrame(animate);
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, cw, ch);

                const now = new Date().getTime();
                
                // 폭죽은 '시작시간~끝시간' 사이에만 발사됨
                if (now >= targetDate && now < stopDate) {
                    if (Math.random() < 0.05) {
                        rockets.push(new Rocket());
                    }
                }

                for (let i = rockets.length - 1; i >= 0; i--) {
                    if (!rockets[i].update()) rockets.splice(i, 1);
                    else rockets[i].draw();
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    if (!particles[i].update()) particles.splice(i, 1);
                    else particles[i].draw();
                }
            }
            animate();
        }

        // 스크립트가 로드되자마자 가장 먼저 상태를 체크하여 실행
        checkInitialState();
    </script>
</body>
</html>
